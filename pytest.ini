[pytest]
# Default to -W error so Stage 1 changes cannot introduce new warnings silently.
# The three ignores below are scoped to the triton package's CUDA-discovery
# messages, which appear only because the *current Python environment* is a
# CPU-only torch build (the machine has an RTX 5070; a CUDA torch build is
# required before formal five-seed training). They are not a code regression.
filterwarnings =
    error
    ignore:Failed to find CUDA:UserWarning
    ignore:Failed to find cuobjdump:UserWarning
    ignore:Failed to find nvdisasm:UserWarning
markers =
    slow: workspace-scale audits (full historical seed scans); deselected by default, run explicitly with -m slow
addopts = -m "not slow"
